version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: strahovka-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: strahovka
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: strahovka-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/strahovka
      TZ: Asia/Almaty
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: strahovka-frontend
    ports:
      - "8082:80"
    depends_on:
      - backend

volumes:
  postgres_data:
